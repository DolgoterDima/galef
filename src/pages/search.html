<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пошук - Galef</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <load src="/parts/header.html" />

  <div class="page-wrapper">
    <main class="main-content">
      <section class="search-page">
        <div class="container search-page__container">
          <nav class="breadcrumbs search-page__breadcrumbs" aria-label="Breadcrumb">
            <a href="/galef/" class="breadcrumbs__link">Головна</a>
            <span class="breadcrumbs__current" aria-current="page">Пошук</span>
          </nav>

          <div class="search-page__content">
            <div class="search-page__result">
              <h1 class="search-page__title">Пошук - офісне крісло</h1>
              <form class="search-page__form" action="/galef/pages/search.html" method="get">
                <input class="search-page__input" type="search" name="search" aria-label="Пошук">
                <button class="search-page__submit" type="submit">Знайти</button>
              </form>
            </div>

            <section class="search-page__products" aria-labelledby="search-products-title">
              <div class="search-page__products-header">
                <h2 class="search-page__subtitle" id="search-products-title">Товари, що відповідають критеріям пошуку</h2>

                <details class="sort-dropdown search-page__sort">
                  <summary class="sort-dropdown__trigger">
                    <span class="sort-dropdown__text">Сортування</span>
                    <svg class="sort-dropdown__arrow" aria-hidden="true">
                      <use href="#icon-chevron-down"></use>
                    </svg>
                  </summary>
                  <ul class="sort-dropdown__menu">
                    <li class="sort-dropdown__item">Від дешевих до дорогих</li>
                    <li class="sort-dropdown__item">Від дорогих до дешевих</li>
                    <li class="sort-dropdown__item">Новинки</li>
                    <li class="sort-dropdown__item">Передзамовлення</li>
                    <li class="sort-dropdown__item">За рейтингом</li>
                  </ul>
                </details>
              </div>

              <div class="search-page__grid">
                <div class="product-card-container">
                  <load src="/parts/product-card.html" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" modifier="product-card--sale" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" modifier="product-card--preorder" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" modifier="product-card--sale" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" modifier="product-card--preorder" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" modifier="product-card--sale" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" modifier="product-card--preorder" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" modifier="product-card--sale" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" modifier="product-card--preorder" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" modifier="product-card--sale" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" modifier="product-card--preorder" />
                </div>
                <div class="product-card-container">
                  <load src="/parts/product-card.html" />
                </div>
              </div>

              <div class="search-page__footer">
                <button class="btn btn--outline search-page__more" type="button">Показати ще 6</button>

                <nav class="search-page__pagination" aria-label="Pagination">
                  <ul class="pagination">
                    <li class="pagination__item">
                      <a href="#" class="pagination__link" aria-label="Previous page">
                        <svg class="pagination__icon" aria-hidden="true"><use href="#icon-chewron-left"></use></svg>
                      </a>
                    </li>
                    <li class="pagination__item"><a href="#" class="pagination__link pagination__link--active">1</a></li>
                    <li class="pagination__item"><a href="#" class="pagination__link">2</a></li>
                    <li class="pagination__item"><a href="#" class="pagination__link">3</a></li>
                    <li class="pagination__item search-page__pagination-extra"><a href="#" class="pagination__link">4</a></li>
                    <li class="pagination__item search-page__pagination-extra"><a href="#" class="pagination__link">5</a></li>
                    <li class="pagination__item search-page__pagination-extra"><a href="#" class="pagination__link">6</a></li>
                    <li class="pagination__item search-page__pagination-extra"><a href="#" class="pagination__link">7</a></li>
                    <li class="pagination__item search-page__pagination-extra"><a href="#" class="pagination__link">8</a></li>
                    <li class="pagination__item"><span class="pagination__link pagination__link--dots">...</span></li>
                    <li class="pagination__item search-page__pagination-extra"><a href="#" class="pagination__link">21</a></li>
                    <li class="pagination__item search-page__pagination-extra"><a href="#" class="pagination__link">22</a></li>
                    <li class="pagination__item"><a href="#" class="pagination__link">23</a></li>
                    <li class="pagination__item">
                      <a href="#" class="pagination__link" aria-label="Next page">
                        <svg class="pagination__icon" aria-hidden="true"><use href="#icon-chewron-right"></use></svg>
                      </a>
                    </li>
                  </ul>
                </nav>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>

    <load src="/parts/footer.html" />
  </div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
